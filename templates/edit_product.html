{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 850px; margin: 40px auto; background: #fff; padding: 35px; border-radius: 16px; box-shadow: var(--card-shadow);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #edf2f7; padding-bottom: 15px;">
        <h2 style="font-family: 'Playfair Display', serif; color: var(--primary-dark); font-size: 24px;"><i class="fa-solid fa-pen-to-square"></i> Chỉnh Sửa Sản Phẩm #{{ product.id }}</h2>
        <a href="{{ url_for('admin_dashboard') }}" style="color: var(--text-muted); text-decoration: none; font-weight: 600;"><i class="fa-solid fa-arrow-left"></i> Quay lại Quản trị</a>
    </div>

    <form action="{{ url_for('edit_product', product_id=product.id) }}" method="POST" enctype="multipart/form-data">
        <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div>
                <label style="font-size: 13px; font-weight: 700;">1. Tên sản phẩm (*):</label>
                <input type="text" name="name" value="{{ product.name }}" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
            </div>
            <div>
                <label style="font-size: 13px; font-weight: 700;">2. Nhóm danh mục (*):</label>
                <select name="group" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
                    <option value="Mật ong" {% if product.group == 'Mật ong' %}selected{% endif %}>Mật ong</option>
                    <option value="Nghệ & Thảo dược" {% if product.group == 'Nghệ & Thảo dược' %}selected{% endif %}>Nghệ & Thảo dược</option>
                    <option value="Ngũ cốc dinh dưỡng" {% if product.group == 'Ngũ cốc dinh dưỡng' %}selected{% endif %}>Ngũ cốc dinh dưỡng</option>
                    <option value="Chè & Món ngọt đặc sản" {% if product.group == 'Chè & Món ngọt đặc sản' %}selected{% endif %}>Chè & Món ngọt đặc sản</option>
                    <option value="Nông sản mùa vụ & Trà" {% if product.group == 'Nông sản mùa vụ & Trà' %}selected{% endif %}>Nông sản mùa vụ & Trà</option>
                </select>
            </div>
            <div>
                <label style="font-size: 13px; font-weight: 700;">3. Giá bán (VNĐ) (*):</label>
                <input type="number" name="price" value="{{ product.price }}" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div>
                <label style="font-size: 13px; font-weight: 700;">4. Nguồn gốc xuất xứ (*):</label>
                <input type="text" name="origin" value="{{ product.origin }}" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
            </div>
            <div>
                <label style="font-size: 13px; font-weight: 700;">5. Quy cách sản phẩm (Đóng gói) (*):</label>
                <input type="text" name="packaging" value="{{ product.packaging }}" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div>
                <label style="font-size: 13px; font-weight: 700;">6. Thành phần sản phẩm:</label>
                <input type="text" name="ingredients" value="{{ product.ingredients }}" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
            </div>
            <div>
                <label style="font-size: 13px; font-weight: 700;">7. Quy trình sản xuất:</label>
                <input type="text" name="process" value="{{ product.process }}" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div>
                <label style="font-size: 13px; font-weight: 700;">8. Hướng dẫn sử dụng:</label>
                <input type="text" name="usage" value="{{ product.usage }}" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
            </div>
            <div>
                <label style="font-size: 13px; font-weight: 700;">9. Cách bảo quản:</label>
                <input type="text" name="storage" value="{{ product.storage }}" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px dashed #cbd5e1;">
            <div>
                <label style="font-size: 13px; font-weight: 700;"><i class="fa-solid fa-upload"></i> Thay ảnh mới từ máy tính:</label>
                <input type="file" name="image_file" accept="image/*" style="width: 100%; padding: 8px; font-size: 13px;">
            </div>
            <div>
                <label style="font-size: 13px; font-weight: 700;"><i class="fa-solid fa-link"></i> Hoặc Link Ảnh (URL):</label>
                <input type="text" name="image_url" value="{{ product.image }}" placeholder="https://domain.com/image.jpg" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
            </div>
        </div>

        <div style="display: flex; gap: 15px;">
            <button type="submit" class="btn-primary" style="padding: 12px 35px; font-size: 15px;"><i class="fa-solid fa-floppy-disk"></i> Lưu Thay Đổi</button>
            <a href="{{ url_for('admin_dashboard') }}" style="background: #e2e8f0; color: #334155; padding: 12px 25px; border-radius: 30px; text-decoration: none; font-weight: bold; font-size: 14px;">Hủy bỏ</a>
        </div>
    </form>
</div>
{% endblock %}
